plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-server-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        shulkerbox_sort {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            runDir 'run-client'
        }
    }
}

processResources {
    inputs.property 'version', mod_version

    filesMatching('fabric.mod.json') {
        expand(
                version: mod_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    from('LICENSES') { into 'META-INF/licenses' }
    from('THIRD_PARTY_NOTICES.md')
    from('src/main/java/com/cntrident/shulkerboxsort/server/DefaultItemOrder.java') {
        into 'META-INF/sources/com/cntrident/shulkerboxsort/server'
    }
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
